<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LISA</title>
<style>
:root{--bg:#050a1a;--line:rgba(110,180,255,.22);--accent:#4aa8ff;--soft:#9fd0ff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.holo{position:relative;flex:none;width:min(100vw,calc(100vh * 586 / 780));aspect-ratio:586/780;overflow:hidden;background:var(--bg)}
.holo::after{content:'';position:absolute;inset:-2px;z-index:2;pointer-events:none;box-shadow:inset 0 0 6vmin 4vmin var(--bg)}
.noedge .holo::after{display:none}
.cover .holo{width:max(100vw,calc(100vh * 586 / 780))}
.cover .holo::after{display:none}
.cover .tag{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px))}
.cover .sub{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(10vh + env(safe-area-inset-bottom,0px))}
.face{position:absolute;inset:0;filter:saturate(1.1) contrast(1.04);animation:pulse 3.5s ease-in-out infinite}
.face>*{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.fx{position:absolute;inset:0;pointer-events:none;animation:flicker 5s infinite}
#fx{position:absolute;inset:0;width:100%;height:100%}
.scan{position:absolute;inset:0;overflow:hidden;mix-blend-mode:screen;background:repeating-linear-gradient(0deg,rgba(120,180,255,.06) 0 1px,transparent 1px 3px)}
.scan::after{content:'';position:absolute;left:0;right:0;top:-25%;height:22%;background:linear-gradient(180deg,transparent,rgba(110,190,255,.2),transparent);animation:sweep 4.5s linear infinite}
.rings{position:absolute;left:0;right:0;bottom:2.5%;height:8%}
.rings i{position:absolute;left:50%;top:50%;width:52%;aspect-ratio:6/1;border:1.5px solid rgba(130,205,255,.85);border-radius:50%;box-shadow:0 0 14px rgba(80,170,255,.7),inset 0 0 14px rgba(80,170,255,.35);transform:translate(-50%,-50%) scale(.3);opacity:0;animation:ring 3.2s ease-out infinite}
.rings i:nth-child(2){animation-delay:1.07s}.rings i:nth-child(3){animation-delay:2.14s}
.tag{position:absolute;top:3%;left:4%;z-index:3;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(10,20,45,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--soft)}
.tag b{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:blink 1.6s ease-in-out infinite}
.sub{position:absolute;left:4%;right:4%;bottom:13%;z-index:3;padding:8px 12px;border-radius:12px;background:rgba(5,12,30,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);text-align:center;font-size:clamp(13px,2.4vmin,18px);line-height:1.35;font-weight:600;color:rgba(223,240,255,.5);opacity:0;transition:opacity .3s;pointer-events:none}
.sub.on{opacity:1}.sub .done{color:#fff;text-shadow:0 0 8px rgba(60,140,255,.9)}
.off{display:none!important}
@keyframes flicker{0%,46%,52%,100%{opacity:1}47%{opacity:.82}48%{opacity:1}49%{opacity:.9}50%{opacity:1}51%{opacity:.86}}
@keyframes pulse{0%,100%{filter:saturate(1.1) contrast(1.04) brightness(1)}50%{filter:saturate(1.25) contrast(1.06) brightness(1.1)}}
@keyframes sweep{to{top:100%}}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.face,.fx,.fx *,.tag b{animation:none!important}}
</style>
</head>
<body>
<div class="holo">
  <div class="tag" id="tag"><b></b>LISA · <span id="state">ONLINE</span></div>
  <div class="face">
    <img id="fallback" src="portrait.webp" alt="LISA" draggable="false">
    <canvas id="face" role="img" aria-label="Лицо ассистента LISA"></canvas>
  </div>
  <div class="fx" id="fxl">
    <canvas id="fx"></canvas>
    <div class="scan"></div>
    <div class="rings"><i></i><i></i><i></i></div>
  </div>
  <div id="sub" class="sub" aria-live="polite"></div>
</div>

<script src="face-data.js"></script>
<script src="lisa-face.js"></script>
<script>
(function(){
  // параметры адреса: ?subs=1 субтитры, ?tag=1 метка состояния, ?fx=0 без эффектов, ?edge=0 без растворения краёв,
  // ?fit=cover на весь экран, ?bg=000000 цвет фона, ?origin=https://app.example разрешённый источник сообщений
  const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);
  if(q.get('subs')!=='1')$('sub').classList.add('off');
  if(q.get('tag')!=='1')$('tag').classList.add('off');
  if(q.get('fx')==='0')$('fxl').classList.add('off');
  if(q.get('edge')==='0')document.body.classList.add('noedge');
  if(q.get('fit')==='cover')document.body.classList.add('cover');
  if(/^[0-9a-fA-F]{6}$/.test(q.get('bg')||''))document.documentElement.style.setProperty('--bg','#'+q.get('bg'));
  const allowOrigin=q.get('origin');
  const sub=$('sub'),stateTag=$('state'),names={idle:'ONLINE',listening:'LISTENING',thinking:'THINKING'};
  const toHost=m=>{try{if(window.parent!==window)window.parent.postMessage(Object.assign({lisa:true},m),allowOrigin||'*')}catch(e){/* хост недоступен */}};

  /* частицы */
  if(q.get('fx')!=='0')(function(){
    const cv=$('fx'),cx=cv.getContext('2d'),box=cv.parentElement,calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
    let W=0,H=0,P=[];
    const mk=i=>({x:Math.random()*W,y:i?Math.random()*H:H*(.9+Math.random()*.1),r:.6+Math.random()*1.6,v:.15+Math.random()*.45,a:.25+Math.random()*.6,p:Math.random()*6.28});
    new ResizeObserver(()=>{const r=box.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(!r.width){W=0;return}W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);P=Array.from({length:32},()=>mk(true))}).observe(box);
    (function tick(){
      if(W&&!calm&&!document.hidden){
        cx.clearRect(0,0,W,H);cx.fillStyle='#8fd0ff';cx.shadowColor='#4aa8ff';cx.shadowBlur=8;
        for(const p of P){p.y-=p.v;p.p+=.03;p.x+=Math.sin(p.p)*.25;if(p.y<-4)Object.assign(p,mk(false));cx.globalAlpha=p.a*Math.min(1,p.y/H*1.6)*(.6+.4*Math.sin(p.p*2));cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
      }
      requestAnimationFrame(tick);
    })();
  })();

  function showSub(t,done){
    if(t==null||!t){sub.classList.remove('on');return}
    sub.textContent='';const d=document.createElement('span');d.className='done';d.textContent=t.slice(0,done);
    sub.append(d,document.createTextNode(t.slice(done)));sub.classList.add('on');
  }

  LisaFace.create($('face'),{image:'portrait.webp'}).then(l=>{
    window.lisa=l;$('fallback').style.display='none';
    l.on('text',e=>showSub(e.text,e.done));
    l.on('speakstart',()=>{stateTag.textContent='SPEAKING';toHost({event:'speakstart'})});
    l.on('speakend',()=>{stateTag.textContent=names[l.state];setTimeout(()=>{if(!l.speaking)showSub(null)},1400);toHost({event:'speakend'})});
    l.on('state',v=>{stateTag.textContent=names[v];toHost({event:'state',value:v})});
    window.dispatchEvent(new Event('lisa-ready'));
    if(typeof window.onLisaReady==='function')window.onLisaReady(l);
    toHost({event:'ready'});
  }).catch(err=>{
    $('face').style.display='none';   // остаётся неподвижный портрет
    console.warn('LISA:',err.message);
    toHost({event:'error',message:String(err.message)});
  });

  // команды от приложения: window.postMessage({lisa:'say', text:'Привет'}, '*')
  const str=(v,n)=>typeof v==='string'?v.slice(0,n):'';
  const num=v=>Math.min(1,Math.max(0,+v||0));
  window.addEventListener('message',e=>{
    const m=e.data,l=window.lisa;
    if(!l||!m||typeof m.lisa!=='string')return;
    if(e.source&&e.source!==window.parent&&e.source!==window)return;   // чужие окна и фреймы игнорируем; нативный хост (source=null) допускаем
    if(allowOrigin&&e.origin!==allowOrigin)return;
    switch(m.lisa){
      case 'say':l.say(str(m.text,600),{mood:str(m.mood,20)||undefined,rate:+m.rate||1,silent:!!m.silent});break;
      case 'audio':if(typeof m.src==='string'&&/^(https?:|blob:|data:audio\/)/.test(m.src))l.speakAudio(m.src,{text:str(m.text,600),mood:str(m.mood,20)||undefined});break;
      case 'feed':l.feed(num(m.level),{round:num(m.round),stretch:num(m.stretch)});break;
      case 'stop':l.stop();break;
      case 'state':l.setState(str(m.value,20));break;
      case 'mood':l.setMood(str(m.value,20));break;
      case 'level':l.level(num(m.value));break;
      case 'react':l.react();break;
    }
  });
})();
</script>
</body>
</html>
