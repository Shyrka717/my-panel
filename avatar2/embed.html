<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ассистент</title>
<style>
:root{--bg:#2b3139;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.frame{position:relative;flex:none;width:min(100vw,calc(100vh * 432 / 556));aspect-ratio:432/556;overflow:hidden;background:var(--bg)}
.frame::after{content:'';position:absolute;inset:-2px;pointer-events:none;box-shadow:inset 0 0 6vmin 4vmin var(--bg)}
.noedge .frame::after,.cover .frame::after{display:none}
.cover .frame{width:max(100vw,calc(100vh * 432 / 556))}
.face>*{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
</style>
</head>
<body>
<div class="frame">
  <div class="face">
    <img id="fallback" src="portrait.webp" alt="Ассистент" draggable="false">
    <canvas id="face" role="img" aria-label="Лицо ассистента"></canvas>
  </div>
</div>
<script src="face-data.js"></script>
<script src="../lisa/lisa-face.js"></script>
<script>
(function(){
  // параметры адреса: ?fit=cover на весь экран, ?edge=0 без растворения краёв, ?bg=000000 цвет фона, ?origin=https://... источник команд
  const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);
  if(q.get('edge')==='0')document.body.classList.add('noedge');
  if(q.get('fit')==='cover')document.body.classList.add('cover');
  if(/^[0-9a-fA-F]{6}$/.test(q.get('bg')||''))document.documentElement.style.setProperty('--bg','#'+q.get('bg'));
  const allowOrigin=q.get('origin');
  const toHost=m=>{try{if(window.parent!==window)window.parent.postMessage(Object.assign({lisa:true},m),allowOrigin||'*')}catch(e){/* хост недоступен */}};

  LisaFace.create($('face'),{image:'portrait.webp',palette:'natural'}).then(l=>{
    window.lisa=l;$('fallback').style.display='none';
    ['speakstart','speakend','state'].forEach(n=>l.on(n,v=>toHost({event:n,value:v})));
    window.dispatchEvent(new Event('lisa-ready'));
    if(typeof window.onLisaReady==='function')window.onLisaReady(l);
    toHost({event:'ready'});
  }).catch(err=>{
    $('face').style.display='none';   // остаётся неподвижный портрет
    console.warn('Ассистент:',err.message);
    toHost({event:'error',message:String(err.message)});
  });

  // команды от приложения: window.postMessage({lisa:'say', text:'Привет'}, '*')
  const str=(v,n)=>typeof v==='string'?v.slice(0,n):'';
  const num=v=>Math.min(1,Math.max(0,+v||0));
  window.addEventListener('message',e=>{
    const m=e.data,l=window.lisa;
    if(!l||!m||typeof m.lisa!=='string')return;
    if(e.source&&e.source!==window.parent&&e.source!==window)return;   // чужие окна и фреймы игнорируем; нативный хост (source=null) допускаем
    if(allowOrigin&&e.origin!==allowOrigin)return;
    switch(m.lisa){
      case 'say':l.say(str(m.text,600),{mood:str(m.mood,20)||undefined,rate:+m.rate||1,silent:!!m.silent});break;
      case 'audio':if(typeof m.src==='string'&&/^(https?:|blob:|data:audio\/)/.test(m.src))l.speakAudio(m.src,{text:str(m.text,600),mood:str(m.mood,20)||undefined});break;
      case 'feed':l.feed(num(m.level),{round:num(m.round),stretch:num(m.stretch)});break;
      case 'stop':l.stop();break;
      case 'state':l.setState(str(m.value,20));break;
      case 'mood':l.setMood(str(m.value,20));break;
      case 'level':l.level(num(m.value));break;
      case 'react':l.react();break;
    }
  });
})();
</script>
</body>
</html>
